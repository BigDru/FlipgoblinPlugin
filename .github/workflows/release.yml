name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # Tests gate the release; `jar` is the plugin-classes jar — the shadowJar dev client is
      # never released.
      - run: ./gradlew --no-daemon --console=plain test jar

      - uses: softprops/action-gh-release@v2
        with:
          files: build/libs/flipgoblin.jar
          generate_release_notes: true
